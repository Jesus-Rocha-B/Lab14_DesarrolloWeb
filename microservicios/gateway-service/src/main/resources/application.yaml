server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: categoria-service
          uri: lb://categoria-service
          predicates:
            - Path=/api/categorias/**
        - id: producto-service
          uri: lb://producto-service
          predicates:
            - Path=/api/productos/**
        - id: cliente-service
          uri: lb://cliente-service
          predicates:
            - Path=/api/clientes/**
        - id: pedido-service
          uri: lb://pedido-service
          predicates:
            - Path=/api/pedidos/**
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: categoria-service-wf
              uri: lb://categoria-service
              predicates:
                - Path=/api/categorias/**
            - id: producto-service-wf
              uri: lb://producto-service
              predicates:
                - Path=/api/productos/**
            - id: cliente-service-wf
              uri: lb://cliente-service
              predicates:
                - Path=/api/clientes/**
            - id: pedido-service-wf
              uri: lb://pedido-service
              predicates:
                - Path=/api/pedidos/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
